<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="A browser window containing a few lines of hand-written markup, with no dependency tree beside it.">
  <title>Hand-written HTML, CSS and JavaScript</title>
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- browser frame -->
  <rect x="96" y="70" width="608" height="310" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M96 104 h608" stroke="#30363d" stroke-width="2"/>
  <circle cx="124" cy="87" r="5" fill="#30363d"/>
  <circle cx="144" cy="87" r="5" fill="#30363d"/>
  <circle cx="164" cy="87" r="5" fill="#30363d"/>
  <rect x="190" y="80" width="300" height="14" rx="7" fill="#0d1117"/>

  <!-- markup lines: indentation implies structure, widths vary like real code -->
  <g fill="#58a6ff">
    <rect x="128" y="134" width="196" height="9" rx="4"/>
    <rect x="152" y="160" width="288" height="9" rx="4"/>
    <rect x="176" y="186" width="152" height="9" rx="4"/>
    <rect x="176" y="212" width="236" height="9" rx="4"/>
  </g>
  <g fill="#8b949e">
    <rect x="152" y="238" width="104" height="9" rx="4"/>
    <rect x="128" y="264" width="180" height="9" rx="4"/>
    <rect x="152" y="290" width="252" height="9" rx="4"/>
    <rect x="176" y="316" width="128" height="9" rx="4"/>
    <rect x="128" y="342" width="88" height="9" rx="4"/>
  </g>

  <!-- the point: nothing in the dependency column -->
  <g>
    <path d="M520 150 v180" stroke="#30363d" stroke-width="2" stroke-dasharray="5 7"/>
    <text x="548" y="196" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="700">0</text>
    <text x="548" y="226" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17">dependencies</text>
    <text x="548" y="276" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="700">0</text>
    <text x="548" y="306" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17">build steps</text>
  </g>
</svg>
