<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veer Phatak — Engineering Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 640px; }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    .accent { color: #58a6ff; }
    p.tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #8b949e;
      margin-bottom: 2rem;
    }
    .status {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #58a6ff;
      border: 1px solid #30363d;
      border-radius: 999px;
      padding: 0.4rem 1rem;
    }
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0; right: 0;
      font-size: 0.8rem;
      color: #6e7681;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Veer <span class="accent">Phatak</span></h1>
    <p class="tagline">Aeronautics &amp; Astronautics Engineer specialising in motorsport, aerodynamics &amp; race strategy.</p>
    <span class="status">Portfolio coming soon</span>
  </div>
  <footer>Southampton, UK</footer>
</body>
</html>
